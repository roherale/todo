name: rollback
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Revision to restore. Leave empty to restore the revision that was live before the current one.
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: UC-DEPLOY-04 choose the target revision
        id: target
        env:
          REQUESTED: ${{ inputs.revision }}
        run: |
          if [ -n "$REQUESTED" ]; then
            target="$REQUESTED"
          else
            live=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
              | jq -r '[.status.traffic[] | select((.percent // 0) > 0)] | sort_by(-.percent) | .[0].revisionName // empty')
            target=$(gcloud run revisions list --service "$SERVICE" --region "$REGION" \
              --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)' \
              | grep -A1 -x "$live" | tail -n1)
            [ -n "$target" ] && [ "$target" != "$live" ] || { echo "no previous revision"; exit 1; }
          fi
          echo "revision=$target" >> "$GITHUB_OUTPUT"
      - name: UC-DEPLOY-04 move 100% of traffic to the target revision
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.target.outputs.revision }}=100"
      - name: UC-DEPLOY-04 require /health to return 200
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$url/health"
