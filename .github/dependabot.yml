version: 2

# One weekly pull request across all three ecosystems.
multi-ecosystem-groups:
  weekly-dependency-updates:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependency-updates
  - package-ecosystem: docker
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependency-updates
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependency-updates
